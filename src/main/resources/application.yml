spring:
  application:
    name: ${SPRING_APPLICATION_NAME:elderhive}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/elderhive}
    username: ${DATABASE_USER:elderhive}
    password: ${DATABASE_PASSWORD:elderhive}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

app:
  url: ${APP_URL:http://localhost:8080}
  frontend:
    # Vite's default dev server origin - CORS allow-list read by SecurityConfig (Phase 1, prompt 12)
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM_ADDRESS:no-reply@elderhive.app}

jwt:
  # dev-only fallback so the app boots with zero setup locally - every other environment MUST
  # set a real JWT_SECRET; never rely on this default outside local dev.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deployment}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes, in ms
  refresh-token:
    expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.boot.autoconfigure: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # spring-boot-starter-mail is on the classpath from Phase 1, but no real SMTP
      # credentials exist until the EmailService work in a later phase - without this,
      # actuator health reports overall DOWN just because it can't reach smtp.gmail.com.
      enabled: false
