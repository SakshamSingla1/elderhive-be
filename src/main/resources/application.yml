spring:
  application:
    name: ${SPRING_APPLICATION_NAME:elderhive}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/elderhive}
    username: ${DATABASE_USER:elderhive}
    password: ${DATABASE_PASSWORD:elderhive}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

app:
  url: ${APP_URL:http://localhost:8080}
  frontend:
    # Vite's default dev server origin - CORS allow-list read by SecurityConfig (Phase 1, prompt 12)
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM_ADDRESS:no-reply@elderhive.app}
  cookie:
    # false in local dev (plain http://localhost) since a Secure cookie is never sent
    # back by the browser over plain HTTP - would silently break login locally if this
    # were hardcoded true the way ElderSphere's AuthController does. Every real
    # deployment MUST set COOKIE_SECURE=true (served over HTTPS).
    secure: ${COOKIE_SECURE:false}
  password-reset:
    token-expiry-minutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:30}
    url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  admin:
    # Blank by default -> AdminBootstrapSeeder's assignment step is a no-op. Set this to
    # an existing ADMIN account's email to grant it the Super Admin role on next boot -
    # the only way to create the first fine-grained admin, since there's no self-service
    # "become admin" flow. Safe to leave set permanently (see the seeder's own javadoc).
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  web-push:
    vapid:
      # Blank by default -> VapidKeyProvider generates an ephemeral key pair on every boot,
      # fine for local dev but means subscriptions don't survive a restart. Every real
      # deployment MUST set these to a persistent, generated-once P-256 key pair (base64url,
      # unpadded) so registered browser subscriptions keep working across restarts.
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:admin@elderhive.app}
  file-storage:
    # Relative to the working directory the app runs from. Used verbatim by
    # FileStorageServiceImpl's local-disk fallback and by WebConfig's /uploads/** resource
    # handler - keep the two in sync (they read the same property).
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    public-base-url: ${FILE_PUBLIC_BASE_URL:${app.url}/uploads}

# Blank by default -> CloudinaryConfig#isConfigured() is false and FileStorageServiceImpl's
# uploads transparently fall back to local disk (app.file-storage.upload-dir above) - safe
# for local dev with zero setup. Set all three for a real deployment.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

jwt:
  # dev-only fallback so the app boots with zero setup locally - every other environment MUST
  # set a real JWT_SECRET; never rely on this default outside local dev.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deployment}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes, in ms
  refresh-token:
    expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.boot.autoconfigure: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # spring-boot-starter-mail is on the classpath from Phase 1, but no real SMTP
      # credentials exist until the EmailService work in a later phase - without this,
      # actuator health reports overall DOWN just because it can't reach smtp.gmail.com.
      enabled: false
